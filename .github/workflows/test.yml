name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  matchstick:
    # Pinned to 22.04 because matchstick ships `binary-linux-22` built against
    # Ubuntu 22.04 glibc; 24.04 runners may hit libc compatibility issues.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Codegen
        run: npm run codegen

      - name: Build subgraph
        run: npm run build

      - name: Run matchstick tests
        run: npm run test:ci
